name: Synchro horaire Spordle

on:
  schedule:
    # 3 fois par jour (heures UTC) : 6 h 17, 12 h 17 et 18 h 17 à l'heure de l'Est
    - cron: "17 10,16,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: spordle-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le navigateur du robot
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chrome || npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb >/dev/null

      - name: Aller chercher les horaires sur Spordle
        env:
          CHROME_CHANNEL: chrome
        run: xvfb-run -a node scripts/spordle-sync.mjs

      - name: Garder les captures d'écran (pour vérifier)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-spordle
          path: spordle-debug/
          retention-days: 7

      - name: Enregistrer les horaires modifiés
        run: |
          git config user.name "robot-spordle"
          git config user.email "robot-spordle@users.noreply.github.com"
          git add horaires
          if git diff --cached --quiet; then
            echo "Aucun changement d'horaire."
          else
            git commit -m "Horaire Spordle mis à jour"
            git push
          fi
